<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>길건너 모험 친구들!</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Google Fonts: Jua / Noto Sans KR -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
      overflow: hidden;
      background-color: #87CEEB;
    }
    .btn-bounce {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-bounce:active {
      transform: scale(0.92);
    }
    .glow-effect {
      box-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
    }
    /* Custom Scrollbar for Character Select */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="w-full h-screen relative bg-sky-300">

  <!-- Header / Score Dashboard -->
  <div class="absolute top-4 left-4 right-4 z-10 flex justify-between items-center pointer-events-none">
    <!-- Score Display -->
    <div class="bg-white/90 backdrop-blur border-4 border-yellow-400 rounded-2xl px-4 py-2 shadow-lg flex items-center gap-3">
      <i class="fa-solid fa-trophy text-yellow-500 text-2xl animate-bounce"></i>
      <div>
        <div class="text-xs text-gray-500 font-bold">점수</div>
        <div id="scoreText" class="text-2xl font-black text-gray-800">0m</div>
      </div>
    </div>

    <!-- Coins Display -->
    <div class="bg-white/90 backdrop-blur border-4 border-amber-400 rounded-2xl px-4 py-2 shadow-lg flex items-center gap-2">
      <i class="fa-solid fa-coins text-amber-500 text-2xl"></i>
      <span id="coinText" class="text-2xl font-black text-amber-600">0</span>
    </div>

    <!-- Audio Toggle -->
    <button id="soundBtn" class="pointer-events-auto bg-white/90 border-4 border-sky-400 p-3 rounded-2xl shadow-lg text-sky-600 hover:bg-sky-50 btn-bounce text-xl">
      <i class="fa-solid fa-volume-high" id="soundIcon"></i>
    </button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverModal" class="hidden absolute inset-0 z-20 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border-8 border-yellow-400 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl transform transition-all scale-100">
      <div class="text-4xl mb-2">🎉 쿵! 닿았어요!</div>
      <h2 class="text-3xl font-black text-gray-800 mb-1">모험 완료!</h2>
      <p id="gameOverReason" class="text-gray-600 font-bold mb-4">멋진 점프였어요!</p>
      
      <div class="bg-yellow-50 border-2 border-yellow-200 rounded-2xl p-4 mb-6">
        <div class="flex justify-between items-center mb-2">
          <span class="text-gray-600 font-bold">이동 거리</span>
          <span id="finalScore" class="text-2xl font-black text-indigo-600">0m</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-600 font-bold">획득한 동전</span>
          <span id="finalCoins" class="text-2xl font-black text-amber-500">0개</span>
        </div>
      </div>

      <div class="flex gap-3">
        <button id="restartBtn" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-black text-xl py-3 px-4 rounded-2xl border-b-4 border-green-700 btn-bounce shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-right"></i> 다시 하기
        </button>
      </div>
    </div>
  </div>

  <!-- Start Screen & Character Selection -->
  <div id="startModal" class="absolute inset-0 z-20 bg-sky-400/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white border-8 border-yellow-400 rounded-3xl p-6 max-w-md w-full text-center shadow-2xl">
      <h1 class="text-4xl font-black text-amber-500 mb-1 drop-shadow-sm">길건너 친구들! 🐣</h1>
      <p class="text-sky-600 font-bold mb-4 text-base">차와 물을 피해 앞으로 폴짝폴짝 뛰어보세요!</p>

      <!-- Character Selector -->
      <div class="mb-6">
        <div class="text-sm font-bold text-gray-500 mb-2">친구를 선택하세요</div>
        <div class="flex justify-center gap-4 overflow-x-auto p-2 no-scrollbar" id="charContainer">
          <!-- Characters dynamically rendered -->
        </div>
      </div>

      <!-- Instructions -->
      <div class="bg-sky-50 rounded-2xl p-3 mb-6 text-left text-xs text-sky-800 space-y-1">
        <div><i class="fa-solid fa-hand-pointer text-amber-500 mr-1"></i> <strong>터치:</strong> 화면 아래 커다란 버튼 클릭</div>
        <div><i class="fa-solid fa-keyboard text-amber-500 mr-1"></i> <strong>키보드:</strong> 방향키 또는 WASD 키 사용</div>
      </div>

      <button id="startBtn" class="w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-black text-2xl py-4 rounded-2xl border-b-4 border-yellow-600 btn-bounce shadow-lg flex items-center justify-center gap-2">
        <i class="fa-solid fa-play"></i> 모험 시작하기!
      </button>
    </div>
  </div>

  <!-- Mobile On-Screen Controller Buttons -->
  <div class="absolute bottom-6 left-0 right-0 z-10 flex flex-col items-center gap-2 pointer-events-none px-4">
    <!-- Big Jump / Forward Button -->
    <div class="flex gap-2 w-full max-w-xs justify-center pointer-events-auto">
      <button id="btnUp" class="w-28 h-20 bg-yellow-400 hover:bg-yellow-300 border-b-8 border-yellow-600 active:border-b-0 active:translate-y-2 rounded-3xl text-gray-900 text-3xl font-black shadow-2xl flex flex-col items-center justify-center btn-bounce">
        <i class="fa-solid fa-angle-up text-3xl"></i>
        <span class="text-xs font-bold mt-1">폴짝!</span>
      </button>
    </div>
    
    <!-- Directional Controls -->
    <div class="flex gap-3 w-full max-w-xs justify-center pointer-events-auto">
      <button id="btnLeft" class="w-20 h-16 bg-sky-500 hover:bg-sky-400 border-b-8 border-sky-700 active:border-b-0 active:translate-y-2 rounded-2xl text-white text-2xl font-bold shadow-xl flex items-center justify-center btn-bounce">
        <i class="fa-solid fa-angle-left"></i>
      </button>
      <button id="btnDown" class="w-20 h-16 bg-sky-500 hover:bg-sky-400 border-b-8 border-sky-700 active:border-b-0 active:translate-y-2 rounded-2xl text-white text-2xl font-bold shadow-xl flex items-center justify-center btn-bounce">
        <i class="fa-solid fa-angle-down"></i>
      </button>
      <button id="btnRight" class="w-20 h-16 bg-sky-500 hover:bg-sky-400 border-b-8 border-sky-700 active:border-b-0 active:translate-y-2 rounded-2xl text-white text-2xl font-bold shadow-xl flex items-center justify-center btn-bounce">
        <i class="fa-solid fa-angle-right"></i>
      </button>
    </div>
  </div>

  <!-- Three.js Canvas Container -->
  <div id="canvasContainer" class="w-full h-full"></div>

  <!-- GAME LOGIC SCRIPT -->
  <script>
    // Web Audio Sound Synthesizer (No external audio files required)
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playJump() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }
      playCoin() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
        osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      }
      playSplash() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
      playHit() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      }
    }

    const sfx = new SoundFX();

    // Constants & Config
    const GRID_SIZE = 1;
    const BOARD_WIDTH = 15; // Left/Right bounds (-7 to 7)
    
    const CHARACTERS = [
      { id: 'chick', name: '꼬꼬 병아리', color: 0xFFD700, beak: 0xFF4500, emoji: '🐥' },
      { id: 'bunny', name: '토끼 토토', color: 0xFFE4E1, accent: 0xFF69B4, emoji: '🐰' },
      { id: 'frog', name: '개구리 개구', color: 0x32CD32, accent: 0x006400, emoji: '🐸' },
      { id: 'pig', name: '꿀꿀이 피기', color: 0xFFB6C1, accent: 0xFF1493, emoji: '🐷' }
    ];

    let selectedChar = CHARACTERS[0];
    let score = 0;
    let coins = 0;
    let isPlaying = false;
    let isGameOver = false;

    // Player position logic
    let playerPos = { x: 0, z: 0 };
    let playerTargetPos = { x: 0, z: 0 };
    let isJumping = false;
    let jumpProgress = 0;
    let facingDirection = 0; // 0: North (+Z direction), 1: East (+X), 2: South (-Z), 3: West (-X)
    let activeLog = null; // Currently standing on floating log

    // Three.js Scene Setup
    const container = document.getElementById('canvasContainer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 45);

    // Camera Setup (Orthographic for Voxel / Isometric view)
    const aspect = window.innerWidth / window.innerHeight;
    const d = 9;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
    
    // Isometric camera position
    camera.position.set(12, 16, 12);
    camera.lookAt(0, 0, 0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 70;
    const shadowD = 15;
    dirLight.shadow.camera.left = -shadowD;
    dirLight.shadow.camera.right = shadowD;
    dirLight.shadow.camera.top = shadowD;
    dirLight.shadow.camera.bottom = -shadowD;
    scene.add(dirLight);

    // Player Mesh Group
    let playerGroup = new THREE.Group();
    scene.add(playerGroup);

    function createCharacterMesh(charData) {
      // Clear current player children
      while (playerGroup.children.length > 0) {
        playerGroup.remove(playerGroup.children[0]);
      }

      const bodyMat = new THREE.MeshLambertMaterial({ color: charData.color });
      
      if (charData.id === 'chick') {
        // Chick Body
        const bodyGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.35;
        body.castShadow = true;
        playerGroup.add(body);

        // Beak
        const beakMat = new THREE.MeshLambertMaterial({ color: charData.beak });
        const beakGeo = new THREE.BoxGeometry(0.2, 0.15, 0.2);
        const beak = new THREE.Mesh(beakGeo, beakMat);
        beak.position.set(0, 0.4, 0.4);
        playerGroup.add(beak);

        // Eyes
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.05);
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.2, 0.5, 0.36);
        const rightEye = leftEye.clone();
        rightEye.position.set(0.2, 0.5, 0.36);
        playerGroup.add(leftEye, rightEye);

        // Comb / Crest
        const combMat = new THREE.MeshLambertMaterial({ color: 0xFF0000 });
        const combGeo = new THREE.BoxGeometry(0.15, 0.2, 0.3);
        const comb = new THREE.Mesh(combGeo, combMat);
        comb.position.set(0, 0.8, 0);
        playerGroup.add(comb);

      } else if (charData.id === 'bunny') {
        // Bunny Body
        const bodyGeo = new THREE.BoxGeometry(0.65, 0.7, 0.65);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.35;
        body.castShadow = true;
        playerGroup.add(body);

        // Long Ears
        const earGeo = new THREE.BoxGeometry(0.15, 0.5, 0.15);
        const leftEar = new THREE.Mesh(earGeo, bodyMat);
        leftEar.position.set(-0.2, 0.9, 0);
        const rightEar = leftEar.clone();
        rightEar.position.set(0.2, 0.9, 0);
        playerGroup.add(leftEar, rightEar);

        // Snout
        const noseMat = new THREE.MeshLambertMaterial({ color: charData.accent });
        const noseGeo = new THREE.BoxGeometry(0.15, 0.1, 0.1);
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.position.set(0, 0.35, 0.35);
        playerGroup.add(nose);

      } else if (charData.id === 'frog') {
        // Frog Body
        const bodyGeo = new THREE.BoxGeometry(0.8, 0.5, 0.7);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.25;
        body.castShadow = true;
        playerGroup.add(body);

        // Big Eyes on top
        const eyeBgMat = new THREE.MeshLambertMaterial({ color: charData.accent });
        const eyeBgGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
        const leftEyeBg = new THREE.Mesh(eyeBgGeo, eyeBgMat);
        leftEyeBg.position.set(-0.25, 0.55, 0.15);
        const rightEyeBg = leftEyeBg.clone();
        rightEyeBg.position.set(0.25, 0.55, 0.15);
        playerGroup.add(leftEyeBg, rightEyeBg);

      } else if (charData.id === 'pig') {
        // Pig Body
        const bodyGeo = new THREE.BoxGeometry(0.75, 0.65, 0.75);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.325;
        body.castShadow = true;
        playerGroup.add(body);

        // Pig Snout
        const snoutMat = new THREE.MeshLambertMaterial({ color: charData.accent });
        const snoutGeo = new THREE.BoxGeometry(0.3, 0.2, 0.1);
        const snout = new THREE.Mesh(snoutGeo, snoutMat);
        snout.position.set(0, 0.3, 0.4);
        playerGroup.add(snout);
      }
    }

    // Lanes array & Object pools
    const lanes = [];
    const LANE_TYPES = {
      GRASS: 'grass',
      ROAD: 'road',
      WATER: 'water'
    };

    // Shared Geometries & Materials for performance
    const grassGeo = new THREE.BoxGeometry(BOARD_WIDTH * 2, 1, 1);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x55A630 });

    const roadGeo = new THREE.BoxGeometry(BOARD_WIDTH * 2, 1, 1);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x4A4E69 });

    const waterGeo = new THREE.BoxGeometry(BOARD_WIDTH * 2, 0.8, 1);
    const waterMat = new THREE.MeshLambertMaterial({ color: 0x0096C7, transparent: true, opacity: 0.85 });

    const treeGeo = new THREE.BoxGeometry(0.8, 1.4, 0.8);
    const treeMat = new THREE.MeshLambertMaterial({ color: 0x2D6A4F });
    const trunkGeo = new THREE.BoxGeometry(0.3, 0.4, 0.3);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6C584C });

    const carGeos = [
      new THREE.BoxGeometry(1.4, 0.6, 0.8),
      new THREE.BoxGeometry(1.8, 0.7, 0.85)
    ];
    const carColors = [0xEE6C4D, 0xF4A261, 0xE76F51, 0x2A9D8F, 0xE63946];

    const logGeo = new THREE.BoxGeometry(2.2, 0.3, 0.7);
    const logMat = new THREE.MeshLambertMaterial({ color: 0x8D5B4C });

    const coinGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.08, 12);
    const coinMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2 });

    // Lane Class
    class Lane {
      constructor(z, type) {
        this.z = z;
        this.type = type;
        this.mesh = new THREE.Group();
        this.obstacles = [];
        this.coins = [];

        // Base ground block
        let ground;
        if (type === LANE_TYPES.GRASS) {
          ground = new THREE.Mesh(grassGeo, grassMat);
          ground.position.set(0, -0.5, z);
          ground.receiveShadow = true;
          this.mesh.add(ground);
          this.populateTrees();
        } else if (type === LANE_TYPES.ROAD) {
          ground = new THREE.Mesh(roadGeo, roadMat);
          ground.position.set(0, -0.5, z);
          ground.receiveShadow = true;
          this.mesh.add(ground);

          this.speed = (Math.random() * 0.04 + 0.03) * (Math.random() > 0.5 ? 1 : -1);
          this.spawnVehicles();
        } else if (type === LANE_TYPES.WATER) {
          ground = new THREE.Mesh(waterGeo, waterMat);
          ground.position.set(0, -0.6, z);
          ground.receiveShadow = true;
          this.mesh.add(ground);

          this.speed = (Math.random() * 0.03 + 0.02) * (Math.random() > 0.5 ? 1 : -1);
          this.spawnLogs();
        }

        // Random coin spawn on grass/safe zones
        if (type === LANE_TYPES.GRASS && z > 2 && Math.random() < 0.35) {
          this.spawnCoin();
        }

        scene.add(this.mesh);
      }

      populateTrees() {
        if (this.z === 0) return; // Keep starting line clear
        
        for (let x = -7; x <= 7; x++) {
          if (Math.abs(x) < 2 && this.z < 3) continue; // Start runway clear

          if (Math.random() < 0.22) {
            const treeGroup = new THREE.Group();
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 0.2, this.z);
            
            const leaves = new THREE.Mesh(treeGeo, treeMat);
            leaves.position.set(x, 0.9, this.z);
            leaves.castShadow = true;

            treeGroup.add(trunk, leaves);
            this.mesh.add(treeGroup);
            this.obstacles.push({ x: x, type: 'tree' });
          }
        }
      }

      spawnVehicles() {
        const carCount = Math.floor(Math.random() * 2) + 2;
        const spacing = (BOARD_WIDTH * 2) / carCount;

        for (let i = 0; i < carCount; i++) {
          const color = carColors[Math.floor(Math.random() * carColors.length)];
          const carMat = new THREE.MeshLambertMaterial({ color });
          const geo = carGeos[Math.floor(Math.random() * carGeos.length)];
          const car = new THREE.Mesh(geo, carMat);
          
          car.position.set(-BOARD_WIDTH + i * spacing + Math.random() * 2, 0.3, this.z);
          car.castShadow = true;
          this.mesh.add(car);
          this.obstacles.push({ mesh: car, width: 1.5 });
        }
      }

      spawnLogs() {
        const logCount = 2;
        const spacing = (BOARD_WIDTH * 2) / logCount;

        for (let i = 0; i < logCount; i++) {
          const log = new THREE.Mesh(logGeo, logMat);
          log.position.set(-BOARD_WIDTH + i * spacing + Math.random() * 3, 0.05, this.z);
          log.receiveShadow = true;
          this.mesh.add(log);
          this.obstacles.push({ mesh: log, width: 2.2 });
        }
      }

      spawnCoin() {
        const validXs = [];
        for (let x = -5; x <= 5; x++) {
          if (!this.obstacles.some(o => o.x === x)) validXs.push(x);
        }
        if (validXs.length > 0) {
          const x = validXs[Math.floor(Math.random() * validXs.length)];
          const coin = new THREE.Mesh(coinGeo, coinMat);
          coin.position.set(x, 0.35, this.z);
          coin.rotation.x = Math.PI / 2;
          this.mesh.add(coin);
          this.coins.push({ mesh: coin, x: x, collected: false });
        }
      }

      update() {
        // Move road cars / river logs
        if (this.type === LANE_TYPES.ROAD || this.type === LANE_TYPES.WATER) {
          this.obstacles.forEach(obs => {
            obs.mesh.position.x += this.speed;
            
            // Wrap around board bounds
            if (this.speed > 0 && obs.mesh.position.x > BOARD_WIDTH) {
              obs.mesh.position.x = -BOARD_WIDTH;
            } else if (this.speed < 0 && obs.mesh.position.x < -BOARD_WIDTH) {
              obs.mesh.position.x = BOARD_WIDTH;
            }
          });
        }

        // Rotate coins
        this.coins.forEach(c => {
          if (!c.collected) {
            c.mesh.rotation.z += 0.04;
          }
        });
      }

      destroy() {
        scene.remove(this.mesh);
      }
    }

    function generateWorld() {
      // Clear existing lanes
      lanes.forEach(lane => lane.destroy());
      lanes.length = 0;

      // Create initial safe platform
      for (let z = -5; z <= 3; z++) {
        lanes.push(new Lane(z, LANE_TYPES.GRASS));
      }

      // Generate forward lanes
      let lastType = LANE_TYPES.GRASS;
      let consecutiveCount = 0;

      for (let z = 4; z < 60; z++) {
        let type = LANE_TYPES.GRASS;
        const rand = Math.random();

        if (rand < 0.45) type = LANE_TYPES.ROAD;
        else if (rand < 0.8) type = LANE_TYPES.WATER;

        if (type === lastType) {
          consecutiveCount++;
          if (consecutiveCount >= 3) {
            type = LANE_TYPES.GRASS;
            consecutiveCount = 0;
          }
        } else {
          consecutiveCount = 1;
        }

        lastType = type;
        lanes.push(new Lane(z, type));
      }
    }

    function addNextLane() {
      const maxZ = lanes[lanes.length - 1].z;
      const nextZ = maxZ + 1;

      let type = LANE_TYPES.GRASS;
      const rand = Math.random();
      if (rand < 0.45) type = LANE_TYPES.ROAD;
      else if (rand < 0.8) type = LANE_TYPES.WATER;

      lanes.push(new Lane(nextZ, type));

      // Remove oldest lane behind player
      if (lanes.length > 70) {
        const oldLane = lanes.shift();
        oldLane.destroy();
      }
    }

    function movePlayer(dirX, dirZ, rotationAngle) {
      if (!isPlaying || isGameOver || isJumping) return;

      const targetX = playerPos.x + dirX;
      const targetZ = playerPos.z + dirZ;

      // Bound check horizontal width
      if (Math.abs(targetX) > 6) return;

      // Find target lane
      const targetLane = lanes.find(l => l.z === targetZ);
      if (!targetLane) return;

      // Check tree obstacle collision
      if (targetLane.type === LANE_TYPES.GRASS) {
        const isBlocked = targetLane.obstacles.some(o => o.x === targetX);
        if (isBlocked) return; // Blocked by tree
      }

      // Initiate jump animation
      playerTargetPos.x = targetX;
      playerTargetPos.z = targetZ;
      facingDirection = rotationAngle;
      playerGroup.rotation.y = rotationAngle;

      isJumping = true;
      jumpProgress = 0;
      activeLog = null; // Reset log standing

      sfx.playJump();

      // Update max forward distance score
      if (targetZ > score) {
        score = targetZ;
        document.getElementById('scoreText').innerText = `${score}m`;
        addNextLane(); // Expand map forward
      }
    }

    // Key inputs
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') movePlayer(0, 1, 0);
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') movePlayer(0, -1, Math.PI);
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') movePlayer(-1, 0, Math.PI / 2);
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') movePlayer(1, 0, -Math.PI / 2);
      else if (e.key === ' ') movePlayer(0, 1, 0); // Spacebar to hop forward
    });

    // Touch Button Controls
    document.getElementById('btnUp').addEventListener('click', () => movePlayer(0, 1, 0));
    document.getElementById('btnDown').addEventListener('click', () => movePlayer(0, -1, Math.PI));
    document.getElementById('btnLeft').addEventListener('click', () => movePlayer(-1, 0, Math.PI / 2));
    document.getElementById('btnRight').addEventListener('click', () => movePlayer(1, 0, -Math.PI / 2));

    function updatePlayerMovement() {
      if (isJumping) {
        jumpProgress += 0.15; // Jump speed

        if (jumpProgress >= 1) {
          jumpProgress = 1;
          isJumping = false;
          playerPos.x = playerTargetPos.x;
          playerPos.z = playerTargetPos.z;
        }

        // Interpolate position + parabolic Y height arc
        playerGroup.position.x = THREE.MathUtils.lerp(playerPos.x, playerTargetPos.x, jumpProgress);
        playerGroup.position.z = THREE.MathUtils.lerp(playerPos.z, playerTargetPos.z, jumpProgress);
        playerGroup.position.y = Math.sin(jumpProgress * Math.PI) * 0.6; // Hop arc height
      } else {
        // If standing on log, move along with log speed
        if (activeLog) {
          playerGroup.position.x += activeLog.speed;
          playerPos.x = playerGroup.position.x;

          // Out of bounds fall check
          if (Math.abs(playerPos.x) > 6.5) {
            triggerGameOver('물에 쓸려나갔어요!');
          }
        }
      }
    }

    function checkCollisions() {
      if (!isPlaying || isGameOver || isJumping) return;

      const currentLane = lanes.find(l => l.z === playerPos.z);
      if (!currentLane) return;

      // 1. Road Car Collision Check
      if (currentLane.type === LANE_TYPES.ROAD) {
        for (let obs of currentLane.obstacles) {
          const carX = obs.mesh.position.x;
          if (Math.abs(carX - playerPos.x) < 0.75) {
            sfx.playHit();
            triggerGameOver('자동차를 조심해야 해요!');
            return;
          }
        }
      }

      // 2. River & Floating Log Check
      if (currentLane.type === LANE_TYPES.WATER) {
        let landedOnLog = false;

        for (let obs of currentLane.obstacles) {
          const logX = obs.mesh.position.x;
          if (Math.abs(logX - playerPos.x) < 1.1) {
            landedOnLog = true;
            activeLog = { speed: currentLane.speed };
            break;
          }
        }

        if (!landedOnLog) {
          sfx.playSplash();
          triggerGameOver('풍덩! 물에 빠졌어요!');
          return;
        }
      }

      // 3. Coin Collection Check
      currentLane.coins.forEach(c => {
        if (!c.collected && Math.abs(c.x - playerPos.x) < 0.5) {
          c.collected = true;
          c.mesh.visible = false;
          coins += 1;
          document.getElementById('coinText').innerText = coins;
          sfx.playCoin();
        }
      });
    }

    function triggerGameOver(reason) {
      isGameOver = true;
      isPlaying = false;
      
      document.getElementById('gameOverReason').innerText = reason;
      document.getElementById('finalScore').innerText = `${score}m`;
      document.getElementById('finalCoins').innerText = `${coins}개`;
      document.getElementById('gameOverModal').classList.remove('hidden');
    }

    function renderCharSelector() {
      const container = document.getElementById('charContainer');
      container.innerHTML = '';

      CHARACTERS.forEach(char => {
        const item = document.createElement('div');
        const isSelected = char.id === selectedChar.id;
        
        item.className = `flex-shrink-0 cursor-pointer p-3 rounded-2xl border-4 transition-all flex flex-col items-center gap-1 ${
          isSelected 
            ? 'border-yellow-500 bg-yellow-100 scale-105 shadow-md' 
            : 'border-gray-200 bg-gray-50 hover:bg-gray-100'
        }`;
        
        item.innerHTML = `
          <div class="text-4xl mb-1">${char.emoji}</div>
          <div class="text-xs font-bold text-gray-800">${char.name}</div>
        `;

        item.addEventListener('click', () => {
          selectedChar = char;
          renderCharSelector();
          createCharacterMesh(selectedChar);
        });

        container.appendChild(item);
      });
    }

    function resetGame() {
      score = 0;
      coins = 0;
      isGameOver = false;
      isPlaying = true;
      
      playerPos = { x: 0, z: 0 };
      playerTargetPos = { x: 0, z: 0 };
      isJumping = false;
      activeLog = null;

      playerGroup.position.set(0, 0, 0);
      playerGroup.rotation.y = 0;

      document.getElementById('scoreText').innerText = '0m';
      document.getElementById('coinText').innerText = '0';
      document.getElementById('gameOverModal').classList.add('hidden');
      document.getElementById('startModal').classList.add('hidden');

      generateWorld();
    }

    // UI Event Listeners
    document.getElementById('startBtn').addEventListener('click', () => {
      sfx.init();
      resetGame();
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      resetGame();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      sfx.enabled = !sfx.enabled;
      const icon = document.getElementById('soundIcon');
      if (sfx.enabled) {
        icon.className = 'fa-solid fa-volume-high';
      } else {
        icon.className = 'fa-solid fa-volume-xmark';
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      if (isPlaying || isGameOver) {
        // Update lanes (moving cars & logs)
        lanes.forEach(lane => lane.update());

        // Update player movement logic
        updatePlayerMovement();

        // Check for collisions
        checkCollisions();

        // Smooth camera follow
        const targetCamZ = playerGroup.position.z + 12;
        const targetCamX = playerGroup.position.x + 12;
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, 0.08);
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, 0.08);
        camera.lookAt(playerGroup.position.x, 0, playerGroup.position.z);

        // Dynamic light follow
        dirLight.position.z = playerGroup.position.z + 20;
        dirLight.position.x = playerGroup.position.x + 20;
      }

      renderer.render(scene, camera);
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
      const newAspect = window.innerWidth / window.innerHeight;
      camera.left = -d * newAspect;
      camera.right = d * newAspect;
      camera.top = d;
      camera.bottom = -d;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialize initial state
    window.onload = function() {
      renderCharSelector();
      createCharacterMesh(selectedChar);
      generateWorld();
      animate();
    };
  </script>
</body>
</html>
